version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    groups:
      react-three:
        patterns:
          - "react"
          - "react-dom"
          - "@react-three/fiber"
          - "three"
          - "framer-motion"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      lint:
        patterns:
          - "eslint*"
          - "@eslint/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
