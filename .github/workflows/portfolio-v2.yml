name: Portfolio Build & Tests

on:
  push:
    branches:
      - main
      - feat/portfolio-v2-quality-and-interactions
  pull_request:
    paths:
      - "src/v2/**"
      - "src/main.jsx"
      - "index.html"
      - "package*.json"
      - "tests/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - ".github/workflows/portfolio-v2.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-production-dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser interaction smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The test runner is installed without changing the production dependency graph.
      # Pin its version for deterministic screenshots and browser behavior.
      - run: npm install --no-save --no-package-lock @playwright/test@1.65.1 @axe-core/playwright@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
