name: Portfolio Build & Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "src/v2/**"
      - "src/main.jsx"
      - "index.html"
      - "package*.json"
      - "public/**"
      - ".env.example"
      - "vite.config.js"
      - "eslint.config.*"
      - ".eslintrc.*"
      - ".github/dependabot.yml"
      - "tests/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - ".github/workflows/portfolio-v2.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve candidate lockfile
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
          node -e 'const s=require("fs").readFileSync("package-lock.json").toString("base64"); for(let i=0;i<s.length;i+=4000) console.log("LOCKFILE_CHUNK "+s.slice(i,i+4000)); console.log("LOCKFILE_END")'
      - run: npm ci
      - name: Dependency audit (report)
        run: |
          npm audit --json > dependency-audit.json || true
          npm audit --omit=dev --audit-level=high || true
          npm outdated || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 7
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-production-dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser interaction smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rm package-lock.json && npm install --package-lock-only --ignore-scripts
      - run: npm ci
      # The test runner is installed without changing the production dependency graph.
      # Pin its version for deterministic screenshots and browser behavior.
      - run: npm install --no-save --no-package-lock @playwright/test@1.65.1 @axe-core/playwright@4.14.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
